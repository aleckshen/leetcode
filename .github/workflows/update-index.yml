name: Update problem index

# Regenerates the README problem table whenever a solution file changes.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md' # avoids re-triggering on the index commit below
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate index
        run: python scripts/generate_index.py

      - name: Commit if the index changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update problem index"
            git push
          else
            echo "Index already up to date."
          fi
